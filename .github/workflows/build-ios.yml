name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mobile Paketlerini Yükle
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild ve Pod Install
        run: |
          cd mobile
          npx expo prebuild -p ios --clean --no-install
          npx pod-install ios

      - name: Xcode ile İmzasız Derleme Yap
        run: |
          cd mobile/ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_PROVISIONING_PROFILE="" \
                     COMPILER_INDEX_STORE_ENABLE=NO | tee xcodebuild.log

      - name: Hata Loglarini Goster
        if: failure()
        run: |
          cd mobile/ios
          echo "================ XCODEBUILD ERROR LOG ================"
          tail -n 150 xcodebuild.log

      - name: IPA Dosyasını Paketle ve Indirmeye Sun
        run: |
          cd mobile
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r app.ipa Payload
          
      - name: IPA Yükle
        uses: actions/upload-artifact@v4
        with:
          name: DeutschFit-unsigned-ipa
          path: mobile/app.ipa
