name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mobile Paketlerini Yükle
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild (iOS projesini oluştur)
        run: |
          cd mobile
          npx expo prebuild -p ios --clean
        env:
          CI: 1

      - name: Xcode ile İmzasız Derleme Yap
        run: |
          cd mobile/ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
            xcodebuild -workspace "$WORKSPACE" \
                       -scheme "$SCHEME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_PROVISIONING_PROFILE=""
          else
            PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            echo "Building Project: $PROJECT with Scheme: $SCHEME"
            xcodebuild -project "$PROJECT" \
                       -scheme "$SCHEME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_PROVISIONING_PROFILE=""
          fi
          cd ..
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r app.ipa Payload

      - name: IPA Dosyasını İndirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: DeutschFit-unsigned-ipa
          path: mobile/app.ipa
