name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mobile Paketlerini Yükle
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild (iOS native projesini oluştur ve Pods yükle)
        run: |
          cd mobile
          npx expo prebuild -p ios --clean --no-install
          npx pod-install ios
        env:
          CI: 1

      - name: Xcode ile İmzasız Derleme Yap
        run: |
          cd mobile/ios
          # Xcode'un node.js'i bulabilmesi için özel çevre değişkenini ayarla
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          
          echo "Building DeutschFit.xcworkspace..."
          xcodebuild -workspace DeutschFit.xcworkspace \
                     -scheme DeutschFit \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_PROVISIONING_PROFILE="" \
                     COMPILER_INDEX_STORE_ENABLE=NO
          cd ..
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r app.ipa Payload

      - name: IPA Dosyasını İndirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: DeutschFit-unsigned-ipa
          path: mobile/app.ipa

