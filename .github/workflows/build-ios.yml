name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mobile Paketlerini Yükle
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild (iOS native projesini oluştur)
        run: |
          cd mobile
          npx expo prebuild -p ios --clean --no-install

      - name: CocoaPods Yükle (Pod Install)
        run: |
          cd mobile/ios
          pod install
        env:
          LANG: en_US.UTF-8

      - name: Xcode ile İmzasız Derleme Yap
        run: |
          cd mobile/ios
          echo "Building DeutschFit.xcworkspace..."
          xcodebuild -workspace DeutschFit.xcworkspace \
                     -scheme DeutschFit \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_PROVISIONING_PROFILE=""
          cd ..
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r app.ipa Payload

      - name: IPA Dosyasını İndirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: DeutschFit-unsigned-ipa
          path: mobile/app.ipa
